name: software verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Report host-only C++ toolchain
        run: g++ --version
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
  esp32-compile-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Install pinned target dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ESP32Servo@3.0.9
      - name: Compile default-disabled and nondeployable operational fixture
        run: bash scripts/compile-esp32.sh
